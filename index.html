<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased select-none pb-12">

  <!-- 헤더 -->

  <!-- 탭 네비게이션 -->

    <div class="max-w-md mx-auto flex">

  <!-- 메인 컨텐츠 영역 -->

    <!-- 1. 온도 탭 -->
    <div id="tab-temp" class="space-y-6">
      
      <!-- Folsom, CA 현재 기온 카드 (앱 실행/재진입 시 자동 실시간 갱신) -->
      <section class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
        <div class="absolute -right-4 -bottom-4 opacity-10">
          <i id="weather-bg-icon" class="fa-solid fa-sun text-9xl"></i>
        </div>
        <div class="flex justify-between items-start mb-2">
          <div>
            <div class="flex items-center space-x-1.5 text-blue-200 text-xs font-semibold tracking-wider uppercase">
              <i class="fa-solid fa-location-dot"></i>
              <span>Folsom, CA</span>
            </div>
            <h2 class="text-lg font-bold">현재 기온</h2>
          </div>
          <span id="weather-status" class="bg-white/20 backdrop-blur-md px-2.5 py-1 rounded-full text-xs font-medium">동기화 중...</span>
        </div>
        <div class="flex items-baseline space-x-3 mt-1">
          <span id="folsom-temp-f" class="text-4xl font-extrabold tracking-tight">--.-°F</span>
          <span id="folsom-temp-c" class="text-2xl text-blue-100 font-semibold">/ --.-°C</span>
        </div>
      </section>

      <!-- 양방향 온도 계산기 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <h3 class="text-base font-bold mb-4 flex items-center text-slate-700">
          <i class="fa-solid fa-calculator text-indigo-500 mr-2"></i>온도 계산기

        <div class="grid grid-cols-1 gap-4">

            <label class="block text-xs font-medium text-slate-500 mb-1">화씨온도 (°F)</label>

        <div class="overflow-x-auto rounded-xl border border-slate-100">

                <th class="px-4 py-3 font-semibold">섭씨 (°C)</th>

        </h3>

            <input type="number" id="input-in" placeholder="in 입력" oninput="convertInToCm()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-base font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">

      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">

          <i class="fa-solid fa-vector-square text-indigo-500 mr-2"></i>넓이 (제곱피트 ↔ 평)

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">제곱피트 (ft²)</label>

          </div>

      </section>

      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <h3 class="text-base font-bold mb-3 flex items-center text-slate-700">
          <i class="fa-solid fa-weight-scale text-indigo-500 mr-2"></i>무게 (파운드 ↔ 그램)
        </h3>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">파운드 (lb)</label>

          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">그램 (g)</label>
            <input type="number" id="input-g" placeholder="g 입력" oninput="convertGToLb()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-base font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
          </div>
        </div>

      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <h3 class="text-base font-bold mb-3 flex items-center text-slate-700">

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">갤런 (gal)</label>

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">리터 (L)</label>
            <input type="number" id="input-l" placeholder="L 입력" oninput="convertLToGal()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-base font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">

        <div class="bg-slate-100 p-1 rounded-xl flex mb-4">

            음력 → 양력

            <div>

              <span id="cal-result" class="text-lg font-bold text-indigo-950">날짜를 선택하세요</span>

      <!-- 2026 한국 휴무일 테이블 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-base font-bold text-slate-700 flex items-center">
            <i class="fa-solid fa-flag text-indigo-500 mr-2"></i>2026년 대한민국 공휴일
          </h3>
          <span class="bg-red-50 text-red-600 text-xs font-bold px-2.5 py-1 rounded-full">한국</span>
        </div>
        <div class="overflow-x-auto rounded-xl border border-slate-100">
          <table class="w-full text-sm text-left">
            <thead class="text-xs text-slate-500 bg-slate-50 border-b border-slate-100">
              <tr>
                <th class="px-4 py-3 font-semibold">날짜</th>
                <th class="px-4 py-3 font-semibold">공휴일명</th>
                <th class="px-4 py-3 font-semibold text-right">요일</th>
              </tr>
            </thead>
            <tbody id="holiday-kr-table-body" class="divide-y divide-slate-100">

          </table>
        </div>
      </section>

      <!-- 2026 미국 휴무일 테이블 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-base font-bold text-slate-700 flex items-center">
            <i class="fa-solid fa-flag-usa text-indigo-500 mr-2"></i>2026년 미국 공휴일
          </h3>
          <span class="bg-blue-50 text-blue-600 text-xs font-bold px-2.5 py-1 rounded-full">미국</span>
        </div>
        <div class="overflow-x-auto rounded-xl border border-slate-100">
          <table class="w-full text-sm text-left">
            <thead class="text-xs text-slate-500 bg-slate-50 border-b border-slate-100">
              <tr>
                <th class="px-4 py-3 font-semibold">날짜</th>
                <th class="px-4 py-3 font-semibold">공휴일명</th>
                <th class="px-4 py-3 font-semibold text-right">요일</th>
              </tr>
            </thead>
            <tbody id="holiday-us-table-body" class="divide-y divide-slate-100">
              <!-- JS로 자동 생성 -->

  </main>

  <script>
    let calendarMode = 'solar'; 

    // 탭 전환
    function switchTab(tab) {
      const tempTab = document.getElementById('tab-temp');
      const miscTab = document.getElementById('tab-misc');
      const dateTab = document.getElementById('tab-date');
      
      const tempBtn = document.getElementById('tab-temp-btn');
      const miscBtn = document.getElementById('tab-misc-btn');
      const dateBtn = document.getElementById('tab-date-btn');

      tempTab.classList.add('hidden');
      miscTab.classList.add('hidden');
      dateTab.classList.add('hidden');

      tempBtn.classList.remove('tab-active');
      tempBtn.classList.add('text-slate-500');
      miscBtn.classList.remove('tab-active');
      miscBtn.classList.add('text-slate-500');
      dateBtn.classList.remove('tab-active');
      dateBtn.classList.add('text-slate-500');

      if (tab === 'temp') {
        tempTab.classList.remove('hidden');
        tempBtn.classList.add('tab-active');
        tempBtn.classList.remove('text-slate-500');
      } else if (tab === 'misc') {
        miscTab.classList.remove('hidden');
        miscBtn.classList.add('tab-active');
        miscBtn.classList.remove('text-slate-500');
      } else if (tab === 'date') {
        dateTab.classList.remove('hidden');
        dateBtn.classList.add('tab-active');
        dateBtn.classList.remove('text-slate-500');
      }
    }

    // Folsom 실시간 날씨 연동 (Open-Meteo API) - 캐시 우회(timestamp 추가) 및 즉시 갱신
    async function fetchFolsomWeather() {
      const statusEl = document.getElementById('weather-status');
      const tempFEl = document.getElementById('folsom-temp-f');
      const tempCEl = document.getElementById('folsom-temp-c');
      
      statusEl.innerText = '갱신 중...';

      try {
        // 브라우저 캐시 방지를 위해 현재 시간 타임스탬프 추가
        const timestamp = new Date().getTime();
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=38.6780&longitude=-121.1761&current_weather=true&temperature_unit=fahrenheit&_=${timestamp}`, {
          cache: 'no-store'
        });
        const data = await res.json();
        
        if (data && data.current_weather) {
          const tempF = data.current_weather.temperature;
          const tempC = ((tempF - 32) * 5 / 9).toFixed(1);
          
          tempFEl.innerText = `${tempF.toFixed(1)}°F`;
          tempCEl.innerText = `/ ${tempC}°C`;
          statusEl.innerText = '실시간 연동';
        }
      } catch (err) {
        console.error('날씨 데이터 연동 실패:', err);
        statusEl.innerText = '오프라인';
      }
    }

    // 1. 온도 변환
    function convertFtoC() {
      const fVal = parseFloat(document.getElementById('input-f').value);
      document.getElementById('input-c').value = !isNaN(fVal) ? ((fVal - 32) * 5 / 9).toFixed(1) : '';
    }
    function convertCtoF() {
      const cVal = parseFloat(document.getElementById('input-c').value);
      document.getElementById('input-f').value = !isNaN(cVal) ? ((cVal * 9 / 5) + 32).toFixed(1) : '';
    }

    // 2. 기타 변환
    function convertInToCm() {
      const v = parseFloat(document.getElementById('input-in').value);
      document.getElementById('input-cm').value = !isNaN(v) ? (v * 2.54).toFixed(2) : '';
    }
    function convertCmToIn() {
      const v = parseFloat(document.getElementById('input-cm').value);
      document.getElementById('input-in').value = !isNaN(v) ? (v / 2.54).toFixed(2) : '';
    }

    function convertSqftToPyung() {
      const v = parseFloat(document.getElementById('input-sqft').value);
      document.getElementById('input-pyung').value = !isNaN(v) ? (v * 0.0281).toFixed(2) : '';
    }
    function convertPyungToSqft() {
      const v = parseFloat(document.getElementById('input-pyung').value);
      document.getElementById('input-sqft').value = !isNaN(v) ? (v / 0.0281).toFixed(2) : '';
    }

    function convertLbToG() {
      const v = parseFloat(document.getElementById('input-lb').value);
      document.getElementById('input-g').value = !isNaN(v) ? (v * 453.592).toFixed(1) : '';
    }
    function convertGToLb() {
      const v = parseFloat(document.getElementById('input-g').value);
      document.getElementById('input-lb').value = !isNaN(v) ? (v / 453.592).toFixed(2) : '';
    }

    function convertGalToL() {
      const v = parseFloat(document.getElementById('input-gal').value);
      document.getElementById('input-l').value = !isNaN(v) ? (v * 3.78541).toFixed(2) : '';
    }
    function convertLToGal() {
      const v = parseFloat(document.getElementById('input-l').value);
      document.getElementById('input-gal').value = !isNaN(v) ? (v / 3.78541).toFixed(2) : '';
    }

    // 온도 참조 테이블
    function renderTempTable() {
      const tbody = document.getElementById('temp-table-body');
      let html = '';
      for (let f = 100; f >= 50; f -= 5) {
        const c = ((f - 32) * 5 / 9).toFixed(1);
        let badgeClass = 'bg-slate-100 text-slate-600';
        let statusText = '보통';
        
        if (f >= 85) {
          badgeClass = 'bg-red-100 text-red-600';
          statusText = '더움';
        } else if (f >= 70) {
          badgeClass = 'bg-emerald-100 text-emerald-600';
          statusText = '쾌적';
        } else if (f <= 60) {
          badgeClass = 'bg-blue-100 text-blue-600';
          statusText = '쌀쌀';
        }

        html += `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="px-4 py-3 font-semibold text-slate-700">${f}°F</td>
            <td class="px-4 py-3 text-slate-600">${c}°C</td>
            <td class="px-4 py-3 text-right">
              <span class="text-xs px-2 py-0.5 rounded-full font-medium ${badgeClass}">${statusText}</span>
            </td>
          </tr>
        `;
      }
      tbody.innerHTML = html;
    }

    // 2026 대한민국 공휴일
    const holidays2026KR = [
      { month: '01', day: '01', name: '신정', dow: '목' },
      { month: '02', day: '16', name: '설날 연휴', dow: '월' },
      { month: '02', day: '17', name: '설날', dow: '화' },
      { month: '02', day: '18', name: '설날 연휴', dow: '수' },
      { month: '03', day: '01', name: '삼일절', dow: '일' },
      { month: '03', day: '02', name: '대체공휴일 (삼일절)', dow: '월' },
      { month: '05', day: '05', name: '어린이날', dow: '화' },
      { month: '05', day: '24', name: '부처님오신날', dow: '일' },
      { month: '05', day: '25', name: '대체공휴일 (부처님오신날)', dow: '월' },
      { month: '06', day: '03', name: '지방선거일', dow: '수' },
      { month: '06', day: '06', name: '현충일', dow: '토' },
      { month: '08', day: '15', name: '광복절', dow: '토' },
      { month: '09', day: '24', name: '추석 연휴', dow: '목' },
      { month: '09', day: '25', name: '추석', dow: '금' },
      { month: '09', day: '26', name: '추석 연휴', dow: '토' },
      { month: '10', day: '03', name: '개천절', dow: '토' },

      { month: '12', day: '25', name: '성탄절', dow: '금' }
    ];

    // 2026 미국 공휴일
    const holidays2026US = [
      { month: '01', day: '01', name: "New Year's Day", dow: '목' },
      { month: '01', day: '19', name: "Martin Luther King Jr. Day", dow: '월' },
      { month: '02', day: '16', name: "Washington's Birthday", dow: '월' },

      { month: '07', day: '04', name: "Independence Day", dow: '토' },

      { month: '12', day: '25', name: "Christmas Day", dow: '금' }
    ];

    function renderHolidaysTable(targetId, holidays) {
      const tbody = document.getElementById(targetId);
      let html = '';
      holidays.forEach(item => {
        const isSunday = item.dow === '일';
        const isSaturday = item.dow === '토';
        let dowClass = 'text-slate-600';
        if (isSunday) dowClass = 'text-red-500 font-bold';
        if (isSaturday) dowClass = 'text-blue-500 font-bold';

        html += `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="px-4 py-2.5">
              <div class="inline-flex flex-col items-center justify-center bg-slate-100 border border-slate-200 rounded-lg px-2.5 py-1 min-w-[50px]">
                <span class="text-[10px] font-bold text-slate-400 leading-none uppercase">${item.month}월</span>
                <span class="text-base font-extrabold text-slate-800 leading-tight">${item.day}</span>
              </div>
            </td>
            <td class="px-4 py-2.5 font-semibold text-slate-700">${item.name}</td>
            <td class="px-4 py-2.5 text-right ${dowClass}">${item.dow}</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    // 변환 모드 설정
    function setCalMode(mode) {
      calendarMode = mode;
      const solarBtn = document.getElementById('mode-solar-btn');
      const lunarBtn = document.getElementById('mode-lunar-btn');
      const inputLabel = document.getElementById('date-input-label');
      const resultLabel = document.getElementById('date-result-label');

      if (mode === 'solar') {
        solarBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition-all";
        lunarBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-500 transition-all";
        inputLabel.innerText = "양력 날짜 선택";
        resultLabel.innerText = "음력 변환 결과";
      } else {
        lunarBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition-all";
        solarBtn.className = "flex-1 py-1.5 text-xs font-bold rounded-lg text-slate-500 transition-all";
        inputLabel.innerText = "음력 날짜 선택";
        resultLabel.innerText = "양력 변환 결과";
      }
      convertCalendarDate();
    }

    // 만세력 기반 정밀 양력 ↔ 음력 계산
    function convertCalendarDate() {
      const inputVal = document.getElementById('cal-date-input').value;
      if (!inputVal) return;

      const [y, m, d] = inputVal.split('-').map(Number);
      
      if (typeof solarlunar === 'undefined') {
        document.getElementById('cal-result').innerText = "만세력 연동 중...";
        return;
      }

      if (calendarMode === 'solar') {
        const result = solarlunar.solar2lunar(y, m, d);
        if (result && result !== -1) {
          const leapStr = result.isLeap ? ' (윤달)' : '';
          document.getElementById('cal-result').innerText = `${result.lYear}년 ${String(result.lMonth).padStart(2, '0')}월 ${String(result.lDay).padStart(2, '0')}일${leapStr}`;
        } else {
          document.getElementById('cal-result').innerText = "변환 불가 날짜";
        }
      } else {
        const result = solarlunar.lunar2solar(y, m, d, false);
        if (result && result !== -1) {
          document.getElementById('cal-result').innerText = `${result.cYear}년 ${String(result.cMonth).padStart(2, '0')}월 ${String(result.cDay).padStart(2, '0')}일`;
        } else {
          document.getElementById('cal-result').innerText = "변환 불가 날짜";
        }
      }
    }

    // 초기화 및 이벤트 리스너 등록
    window.addEventListener('DOMContentLoaded', () => {
      renderTempTable();
      renderHolidaysTable('holiday-kr-table-body', holidays2026KR);
      renderHolidaysTable('holiday-us-table-body', holidays2026US);
      fetchFolsomWeather();
      
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('cal-date-input').value = today;
      convertCalendarDate();
    });

    // 사파리 등에서 앱을 백그라운드에서 다시 포그라운드로 가져올 때(앱을 열 때) 실시간 날씨 재갱신
    window.addEventListener('pageshow', (event) => {
      fetchFolsomWeather();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        fetchFolsomWeather();
      }
    });
  </script>
