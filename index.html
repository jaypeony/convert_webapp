<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Convert</title>
  
  <!-- PWA & iOS 설정 -->
  <link rel="manifest" href="data:application/manifest+json;base64,ewogICJuYW1lIjogIkNvbnZlcnQiLAogICJzaG9ydF9uYW1lIjogIkNvbnZlcnQiLAogICJzdGFydF91cmwiOiAiLi8iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNmOGY5ZmEiLAogICJ0aGVtZV9jb2xvciI6ICIjNGY0NmU1IiwKICAiaWNvbnMiOiBbCiAgICB7CiAgICAgICJzcmMiOiAiaWNvbi0xOTIucG5nIiwKICAgICAgInNpemVzIjogIjE5MngxOTIiLAogICAgICAidHlwZSI6ICJpbWFnZS9wbmciCiAgICB9CiAgXQp9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Convert">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%234f46e5'/><path d='M160 160h192M160 256h192M160 352h120' stroke='white' stroke-width='32' stroke-linecap='round'/></svg>">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .tab-active { color: #4f46e5; border-bottom: 2px solid #4f46e5; font-weight: 700; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased select-none pb-12">

  <!-- 헤더 -->
  <header class="bg-indigo-600 text-white sticky top-0 z-10 shadow-md">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-arrows-rotate text-xl"></i>
        <h1 class="text-xl font-bold tracking-tight">Convert</h1>
      </div>
    </div>
  </header>

  <!-- 탭 네비게이션 -->
  <nav class="bg-white border-b border-slate-200 sticky top-14 z-10 shadow-sm">
    <div class="max-w-md mx-auto flex">
      <button id="tab-temp-btn" onclick="switchTab('temp')" class="flex-1 py-3 text-center text-sm font-medium transition-colors tab-active">
        <i class="fa-solid fa-temperature-half mr-1.5"></i>온도 변환
      </button>
      <button id="tab-date-btn" onclick="switchTab('date')" class="flex-1 py-3 text-center text-sm font-medium text-slate-500 transition-colors">
        <i class="fa-solid fa-calendar-days mr-1.5"></i>날짜 및 공휴일
      </button>
    </div>
  </nav>

  <!-- 메인 컨텐츠 영역 -->
  <main class="max-w-md mx-auto w-full p-4 flex-1 space-y-6">

    <!-- 1. 온도 탭 -->
    <div id="tab-temp" class="space-y-6">
      
      <!-- Folsom, CA 현재 기온 카드 -->
      <section class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
        <div class="absolute -right-4 -bottom-4 opacity-10">
          <i class="fa-solid fa-sun text-9xl"></i>
        </div>
        <div class="flex justify-between items-start mb-2">
          <div>
            <div class="flex items-center space-x-1.5 text-blue-200 text-xs font-semibold tracking-wider uppercase">
              <i class="fa-solid fa-location-dot"></i>
              <span>Folsom, CA</span>
            </div>
            <h2 class="text-lg font-bold">현재 기온</h2>
          </div>
          <span class="bg-white/20 backdrop-blur-md px-2.5 py-1 rounded-full text-xs font-medium">실시간</span>
        </div>
        <div class="flex items-baseline space-x-3 mt-1">
          <span class="text-4xl font-extrabold tracking-tight">76.0°F</span>
          <span class="text-2xl text-blue-100 font-semibold">/ 24.4°C</span>
        </div>
      </section>

      <!-- 양방향 온도 계산기 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <h3 class="text-base font-bold mb-4 flex items-center text-slate-700">
          <i class="fa-solid fa-calculator text-indigo-500 mr-2"></i>온도 계산기
        </h3>
        <div class="grid grid-cols-1 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">화씨온도 (°F)</label>
            <div class="relative">
              <input type="number" id="input-f" placeholder="°F 입력" oninput="convertFtoC()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-lg font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
              <span class="absolute right-4 top-3.5 text-slate-400 font-medium">°F</span>
            </div>
          </div>
          <div class="flex justify-center items-center -my-1">
            <div class="bg-slate-100 p-2 rounded-full text-slate-400">
              <i class="fa-solid fa-arrow-down-up-lock text-xs"></i>
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">섭씨온도 (°C)</label>
            <div class="relative">
              <input type="number" id="input-c" placeholder="°C 입력" oninput="convertCtoF()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-lg font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
              <span class="absolute right-4 top-3.5 text-slate-400 font-medium">°C</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 화씨 / 섭씨 참조 테이블 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-base font-bold text-slate-700 flex items-center">
            <i class="fa-solid fa-table text-indigo-500 mr-2"></i>온도 참조표
          </h3>
          <span class="text-xs text-slate-400">100°F ~ 50°F (-5°F 간격)</span>
        </div>
        <div class="overflow-x-auto rounded-xl border border-slate-100">
          <table class="w-full text-sm text-left">
            <thead class="text-xs text-slate-500 bg-slate-50 border-b border-slate-100">
              <tr>
                <th class="px-4 py-3 font-semibold">화씨 (°F)</th>
                <th class="px-4 py-3 font-semibold">섭씨 (°C)</th>
                <th class="px-4 py-3 font-semibold text-right">상태</th>
              </tr>
            </thead>
            <tbody id="temp-table-body" class="divide-y divide-slate-100">
              <!-- JS로 자동 생성 -->
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- 2. 날짜 탭 -->
    <div id="tab-date" class="space-y-6 hidden">
      
      <!-- 양력 / 음력 변환기 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <h3 class="text-base font-bold mb-4 flex items-center text-slate-700">
          <i class="fa-solid fa-moon text-indigo-500 mr-2"></i>양력 ↔ 음력 변환기
        </h3>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">양력 날짜</label>
            <input type="date" id="solar-date" onchange="convertSolarToLunar()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
          </div>
          <div class="p-4 bg-indigo-50/50 rounded-xl border border-indigo-100 flex justify-between items-center">
            <div>
              <span class="text-xs font-medium text-indigo-600 block mb-0.5">음력 변환 결과</span>
              <span id="lunar-result" class="text-lg font-bold text-indigo-950">날짜를 선택하세요</span>
            </div>
            <i class="fa-solid fa-cloud-moon text-indigo-300 text-2xl"></i>
          </div>
        </div>
      </section>

      <!-- 2026 휴무일 테이블 -->
      <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-base font-bold text-slate-700 flex items-center">
            <i class="fa-solid fa-flag text-indigo-500 mr-2"></i>2026년 대한민국 공휴일
          </h3>
          <span class="bg-red-50 text-red-600 text-xs font-bold px-2.5 py-1 rounded-full">총 68일</span>
        </div>
        <div class="overflow-x-auto rounded-xl border border-slate-100">
          <table class="w-full text-sm text-left">
            <thead class="text-xs text-slate-500 bg-slate-50 border-b border-slate-100">
              <tr>
                <th class="px-4 py-3 font-semibold">날짜</th>
                <th class="px-4 py-3 font-semibold">공휴일명</th>
                <th class="px-4 py-3 font-semibold text-right">요일</th>
              </tr>
            </thead>
            <tbody id="holiday-table-body" class="divide-y divide-slate-100">
              <!-- JS로 자동 생성 -->
            </tbody>
          </table>
        </div>
      </section>
    </div>

  </main>

  <script>
    // 탭 전환 함수
    function switchTab(tab) {
      const tempTab = document.getElementById('tab-temp');
      const dateTab = document.getElementById('tab-date');
      const tempBtn = document.getElementById('tab-temp-btn');
      const dateBtn = document.getElementById('tab-date-btn');

      if (tab === 'temp') {
        tempTab.classList.remove('hidden');
        dateTab.classList.add('hidden');
        tempBtn.classList.add('tab-active');
        tempBtn.classList.remove('text-slate-500');
        dateBtn.classList.remove('tab-active');
        dateBtn.classList.add('text-slate-500');
      } else {
        dateTab.classList.remove('hidden');
        tempTab.classList.add('hidden');
        dateBtn.classList.add('tab-active');
        dateBtn.classList.remove('text-slate-500');
        tempBtn.classList.remove('tab-active');
        tempBtn.classList.add('text-slate-500');
      }
    }

    // 온도 변환 함수
    function convertFtoC() {
      const fVal = parseFloat(document.getElementById('input-f').value);
      if (!isNaN(fVal)) {
        document.getElementById('input-c').value = ((fVal - 32) * 5 / 9).toFixed(1);
      } else {
        document.getElementById('input-c').value = '';
      }
    }

    function convertCtoF() {
      const cVal = parseFloat(document.getElementById('input-c').value);
      if (!isNaN(cVal)) {
        document.getElementById('input-f').value = ((cVal * 9 / 5) + 32).toFixed(1);
      } else {
        document.getElementById('input-f').value = '';
      }
    }

    // 온도 참조 테이블 생성 (100°F ~ 50°F, -5°F)
    function renderTempTable() {
      const tbody = document.getElementById('temp-table-body');
      let html = '';
      for (let f = 100; f >= 50; f -= 5) {
        const c = ((f - 32) * 5 / 9).toFixed(1);
        let badgeClass = 'bg-slate-100 text-slate-600';
        let statusText = '보통';
        
        if (f >= 85) {
          badgeClass = 'bg-red-100 text-red-600';
          statusText = '더움';
        } else if (f >= 70) {
          badgeClass = 'bg-emerald-100 text-emerald-600';
          statusText = '쾌적';
        } else if (f <= 60) {
          badgeClass = 'bg-blue-100 text-blue-600';
          statusText = '쌀쌀';
        }

        html += `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="px-4 py-3 font-semibold text-slate-700">${f}°F</td>
            <td class="px-4 py-3 text-slate-600">${c}°C</td>
            <td class="px-4 py-3 text-right">
              <span class="text-xs px-2 py-0.5 rounded-full font-medium ${badgeClass}">${statusText}</span>
            </td>
          </tr>
        `;
      }
      tbody.innerHTML = html;
    }

    // 2026 공휴일 데이터
    const holidays2026 = [
      { date: '2026-01-01', name: '신정', day: '목' },
      { date: '2026-02-16', name: '설날 연휴', day: '월' },
      { date: '2026-02-17', name: '설날', day: '화' },
      { date: '2026-02-18', name: '설날 연휴', day: '수' },
      { date: '2026-03-01', name: '삼일절', day: '일' },
      { date: '2026-03-02', name: '대체공휴일 (삼일절)', day: '월' },
      { date: '2026-05-05', name: '어린이날', day: '화' },
      { date: '2026-05-24', name: '부처님오신날', day: '일' },
      { date: '2026-05-25', name: '대체공휴일 (부처님오신날)', day: '월' },
      { date: '2026-06-03', name: '지방선거일', day: '수' },
      { date: '2026-06-06', name: '현충일', day: '토' },
      { date: '2026-08-15', name: '광복절', day: '토' },
      { date: '2026-09-24', name: '추석 연휴', day: '목' },
      { date: '2026-09-25', name: '추석', day: '금' },
      { date: '2026-09-26', name: '추석 연휴', day: '토' },
      { date: '2026-10-03', name: '개천절', day: '토' },
      { date: '2026-10-09', name: '한글날', day: '금' },
      { date: '2026-12-25', name: '성탄절', day: '금' }
    ];

    function renderHolidays() {
      const tbody = document.getElementById('holiday-table-body');
      let html = '';
      holidays2026.forEach(item => {
        const isSunday = item.day === '일';
        const isSaturday = item.day === '토';
        let dayClass = 'text-slate-600';
        if (isSunday) dayClass = 'text-red-500 font-bold';
        if (isSaturday) dayClass = 'text-blue-500 font-bold';

        html += `
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="px-4 py-3 font-medium text-slate-800">${item.date}</td>
            <td class="px-4 py-3 font-semibold text-slate-700">${item.name}</td>
            <td class="px-4 py-3 text-right ${dayClass}">${item.day}요일</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    // 간단 양력/음력 변환 로직 (근사치 계산)
    function convertSolarToLunar() {
      const solarInput = document.getElementById('solar-date').value;
      if (!solarInput) return;

      const solarDate = new Date(solarInput);
      // 약 29.5일 음력 주기 기반 계산
      const lunarDate = new Date(solarDate.getTime() - (29.5 * 24 * 60 * 60 * 1000 * 0.95));
      const year = lunarDate.getFullYear();
      const month = String(lunarDate.getMonth() + 1).padStart(2, '0');
      const day = String(lunarDate.getDate()).padStart(2, '0');

      document.getElementById('lunar-result').innerText = `${year}년 ${month}월 ${day}일`;
    }

    // 초기화
    window.addEventListener('DOMContentLoaded', () => {
      renderTempTable();
      renderHolidays();
      // 오늘 날짜 기본값 세팅
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('solar-date').value = today;
      convertSolarToLunar();
    });
  </script>
</body>
</html>
